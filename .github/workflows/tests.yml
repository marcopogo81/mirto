# Tre sistemi per due versioni di Python, a ogni push. Su un repository privato i runner
# macOS costano dieci volte quelli Linux, quindi vale la pena sapere quanto durano: oggi
# 109-117 secondi, come gli altri. Erano 510 finché i test cercavano indirizzi inesistenti
# sulla rete (vedi tests/senza_rete.py): è lì che si nascondeva il costo, non nella matrice.
name: Tests

on:
  push:
    branches: [main, lancio]
  pull_request:
  workflow_dispatch:
  # Richiamabile da release.yml: il rilascio non parte finche' queste prove non sono verdi.
  # Il tag non e' piu' fra i suoi inneschi apposta - se no, su un tag la suite girerebbe due
  # volte, una qui e una dentro il rilascio, e i runner macOS costano dieci volte gli altri.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      MIRTO_STATS_URL: "off"   # nessuna chiamata al server delle statistiche durante le prove
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for Qt and OpenCV (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          lock="requirements-$(python -c 'import sys; print({"darwin": "macos", "win32": "windows"}.get(sys.platform, "linux"))').lock"
          if [ -f "$lock" ]; then
            echo "Uso $lock: versioni fissate con impronta SHA-256"
            pip install --require-hashes -r "$lock"
          else
            pip install -r requirements.txt
          fi
      - name: Start up (imports and entry point)
        run: python -m mirto --version
      - name: Run tests
        # Non «python -m unittest»: lo stesso lavoro, ma in fondo al registro resta scritto
        # quali test costano su questo sistema. Serve a capire perché un runner è più lento
        # di un altro senza doverlo indovinare.
        run: python tools/tempi-test.py

      - name: Which module dies (only if the tests failed)
        # Quando la suite non muore dentro una prova ma porta giu' il processo, unittest non ha niente
        # da raccontare e la CI resta rossa senza motivo leggibile (Windows, 21/10). Qui ogni file di
        # prove gira isolato e quello che non torna indietro lo dice col proprio nome.
        if: failure()
        run: python tools/tempi-test.py --a-moduli

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
